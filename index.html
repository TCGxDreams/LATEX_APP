<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI LaTeX Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4sm53xCKg0KDe527D+LtuuQyWDf7u7fQRvUO75sFnlXji7b" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar for a cleaner IDE look */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 5px;
        border: 2px solid #f1f1f1;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      body {
        overscroll-behavior: none;
      }
      
      /* Print Styles for PDF Export */
      @media print {
        @page {
          margin: 0;
          size: A4;
        }
        body * {
          visibility: hidden;
        }
        .print-content, .print-content * {
          visibility: visible;
        }
        .print-content {
          position: absolute;
          left: 0;
          top: 0;
          width: 21cm; /* A4 Width */
          min-height: 29.7cm;
          margin: 0;
          padding: 2.5cm !important;
          box-shadow: none !important;
          background: white !important;
          overflow: visible !important;
          transform: none !important;
        }
        /* Handle page breaks */
        .page-break {
          break-after: page;
          page-break-after: always;
          height: 0;
          margin: 0;
          border: none;
        }
        /* Hide UI elements */
        .no-print {
          display: none !important;
        }
      }
    </style>
